name: AI Inbox
description: Paste an article, URL, image, thought, or conversation for later AI organization.
title: "[inbox] "
labels:
  - ai-inbox
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Paste anything here. Do not organize it. AI will sort it later.
        Do not paste passwords, API keys, recovery codes, membership numbers, customer numbers, reservation numbers, or other sensitive identifiers.
  - type: textarea
    id: capture
    attributes:
      label: Capture
      description: Paste text, URLs, article snippets, images, screenshots, or conversation notes.
      placeholder: |
        インボックス化して。

        URL:
        Why saved:
        Raw:
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Source
      description: Pick the closest source. Use unknown when unsure.
      options:
        - unknown
        - github-mobile
        - siri
        - gemini
        - web-llm
        - url-drop
        - manual
    validations:
      required: true
  - type: textarea
    id: desired_result
    attributes:
      label: Desired result
      description: Optional. Leave blank if you only want AI to organize it.
      placeholder: |
        例:
        - あとで読めるように要約して
        - タスクだけ抜き出して
        - プロジェクトノートに入れて
        - ただ保存して
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This does not include passwords, API keys, recovery codes, private tokens, membership numbers, customer numbers, or reservation numbers.
          required: true
